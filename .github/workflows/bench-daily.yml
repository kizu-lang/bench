name: bench-daily

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Overwrite today's existing GHA result directories if already present
        type: boolean
        required: false
        default: true
      kizu_source:
        description: Which kizu compiler to benchmark (main HEAD or pinned kugi.toml release)
        type: choice
        required: false
        default: main
        options:
          - main
          - pinned
      kizu_ref:
        description: Git ref of kizu-lang/kizu to build when kizu_source is main
        type: string
        required: false
        default: main

concurrency:
  group: bench-daily
  cancel-in-progress: false

permissions: {}

jobs:
  bench:
    permissions:
      contents: read
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            kugi_asset: kugi-0.1.0-linux-x86_64.tar.gz
            kugi_sha256: be5e5a997d85300e198768a0dc2999ec2d12cd4d56bda09b393b8625f9998b01
          - name: macos-arm64
            os: macos-15
            kugi_asset: kugi-0.1.0-darwin-aarch64.tar.gz
            kugi_sha256: d7d8d86bbec5d80b6b9a6993fd230e6344c676bfe0ac5999085c2711deaf8840
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Prepare benchmark run ID
        id: prep
        shell: bash
        env:
          TARGET_NAME: ${{ matrix.name }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          INPUT_KIZU_SOURCE: ${{ inputs.kizu_source || 'main' }}
          INPUT_KIZU_REF: ${{ inputs.kizu_ref || 'main' }}
        run: |
          set -euo pipefail
          RUN_ID="$(date -u +%Y-%m-%d)-gha-${TARGET_NAME}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "kizu_source=${INPUT_KIZU_SOURCE}" >> "$GITHUB_OUTPUT"
            echo "kizu_ref=${INPUT_KIZU_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "kizu_source=main" >> "$GITHUB_OUTPUT"
            echo "kizu_ref=main" >> "$GITHUB_OUTPUT"
          fi
          if [ -d "results/${RUN_ID}" ]; then
            if [ "${FORCE}" = "true" ]; then
              rm -rf "results/${RUN_ID}"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "Results for ${RUN_ID} already exist and force is false; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kugi (SHA-256 verified)
        if: steps.prep.outputs.skip != 'true'
        shell: bash
        env:
          KUGI_ASSET: ${{ matrix.kugi_asset }}
          KUGI_SHA256: ${{ matrix.kugi_sha256 }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${KUGI_ASSET}"
          url="https://github.com/soyukke/kugi/releases/download/v0.1.0/${KUGI_ASSET}"
          curl -fsSL --proto '=https' --proto-redir '=https' -o "$archive" "$url"
          if [ "$(uname -s)" = "Darwin" ]; then
            echo "${KUGI_SHA256}  ${archive}" | shasum -a 256 -c -
          else
            echo "${KUGI_SHA256}  ${archive}" | sha256sum -c -
          fi
          mkdir -p "${RUNNER_TEMP}/kugi-bin"
          tar -xzf "$archive" --strip-components=1 -C "${RUNNER_TEMP}/kugi-bin"
          test -x "${RUNNER_TEMP}/kugi-bin/kugi"
          echo "${RUNNER_TEMP}/kugi-bin" >> "$GITHUB_PATH"

      - name: Verify host toolchains
        if: steps.prep.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${HOME}/.cargo/bin" ]; then
            echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="${HOME}/.cargo/bin:${PATH}"
          fi
          if [ "$(uname -s)" = "Linux" ]; then
            missing=()
            command -v clang > /dev/null || missing+=(clang)
            [ -x /usr/bin/time ] || missing+=(time)
            if [ "${#missing[@]}" -gt 0 ]; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${missing[@]}"
            fi
          fi
          for tool in clang rustc cargo python3 make; do
            command -v "$tool" > /dev/null || { echo "missing required tool: $tool" >&2; exit 1; }
          done
          clang --version | head -1
          rustc --version
          cargo --version
          python3 --version

      - name: Provision pinned toolchains with kugi
        if: steps.prep.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          kugi sync

      - name: Checkout kizu-lang/kizu
        if: steps.prep.outputs.skip != 'true' && steps.prep.outputs.kizu_source == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kizu-lang/kizu
          ref: ${{ steps.prep.outputs.kizu_ref }}
          path: .kizu-src
          fetch-depth: 1

      - name: Build kizu from source
        if: steps.prep.outputs.skip != 'true' && steps.prep.outputs.kizu_source == 'main'
        shell: bash
        run: |
          set -euo pipefail
          kizu_commit="$(git -C .kizu-src rev-parse --short=12 HEAD)"
          prefix="${RUNNER_TEMP}/kizu-main"
          rm -rf "${prefix}"
          mkdir -p "${prefix}/bin" "${prefix}/lib"
          kugi exec -- bash -euo pipefail -c '
            cd .kizu-src
            scripts/gen-selfhost-version.sh
            KIZU_LIB_DIR="" KIZU_CACHE_DIR="'"${RUNNER_TEMP}/kizu-seed-cache"'" kizu build --target native --opt --backend llvm -o "'"${prefix}/bin/kizu"'" compiler
          '
          cp -R .kizu-src/lib/kizu "${prefix}/lib/kizu"
          rm -rf .kizu-src "${RUNNER_TEMP}/kizu-seed-cache"
          ver="$(KIZU_LIB_DIR="${prefix}/lib/kizu" "${prefix}/bin/kizu" version)"
          echo "Built kizu: ${ver}"
          case "${ver}" in
            *"${kizu_commit}"*) ;;
            *) echo "Expected commit ${kizu_commit} in version string: ${ver}" >&2; exit 1 ;;
          esac
          case "${ver}" in
            *v0.10.0*) echo "Unexpected pinned seed version: ${ver}" >&2; exit 1 ;;
          esac
          echo "KIZU_OVERRIDE_BIN=${prefix}/bin/kizu" >> "$GITHUB_ENV"
          echo "KIZU_OVERRIDE_LIB_DIR=${prefix}/lib/kizu" >> "$GITHUB_ENV"
          echo "KIZU_COMMIT=${kizu_commit}" >> "$GITHUB_ENV"
          echo "KIZU_SOURCE=main" >> "$GITHUB_ENV"

      - name: Check effective toolchain versions
        if: steps.prep.outputs.skip != 'true'
        shell: bash
        env:
          KIZU_SOURCE: ${{ steps.prep.outputs.kizu_source }}
        run: |
          set -euo pipefail
          kugi exec -- just doctor

      - name: Run benchmark suite
        if: steps.prep.outputs.skip != 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.prep.outputs.run_id }}
          KIZU_SOURCE: ${{ steps.prep.outputs.kizu_source }}
          KIZU_CHECKOUT: ''
          SKIP_REAL_CODE: '1'
          SKIP_VALGRIND: '1'
          ROUNDS: '2'
          RUNS: '3'
        run: |
          set -euo pipefail
          kugi exec -- just compare "${RUN_ID}"
          mkdir -p "${RUNNER_TEMP}/artifact"
          cp -R "results/${RUN_ID}" "${RUNNER_TEMP}/artifact/${RUN_ID}"

      - name: Upload benchmark results
        if: steps.prep.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bench-${{ matrix.name }}
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [bench]
    if: always() && (needs.bench.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Download benchmark artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - name: Integrate results, prune old CI runs, and regenerate site data
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${RUNNER_TEMP}/artifacts" ]; then
            for d in "${RUNNER_TEMP}/artifacts"/*-gha-*; do
              [ -d "$d" ] || continue
              base="$(basename "$d")"
              rm -rf "results/${base}"
              cp -R "$d" "results/${base}"
            done
          fi
          python3 scripts/prune-ci-results.py --keep 30
          python3 scripts/build-site-data.py

      - name: Validate docs/data.json and check for path leaks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/data.json > /dev/null
          python3 scripts/build-site-data.py --check
          if grep -rnE '(/home/|/Users/|/Volumes/)' results/ docs/data.json; then
            echo "Absolute local path leak detected in results/ or docs/data.json." >&2
            exit 1
          fi

      - name: Commit and push updated benchmark results
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs/data.json
          git commit -m "bench: daily results ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
