name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      instructions:
        description: Count instructions with valgrind (slow)
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: build every variant
        run: nix develop -c scripts/build-runtime.sh
      - name: every variant prints the same
        run: nix develop -c scripts/check.sh
      - name: count instructions
        if: ${{ inputs.instructions }}
        run: |
          nix develop -c scripts/instructions.sh target/ci/runtime
          nix develop -c python3 scripts/report.py target/ci > target/ci/README.md
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.instructions }}
        with:
          name: instructions
          path: target/ci
