name: contribution-guard

on:
  pull_request_target:
    types: [opened, reopened]
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Enforce maintainer-only PRs and issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
        run: |
          set -euo pipefail

          if [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo 'Allowed automated workflow actor.'
            exit 0
          fi

          case "$AUTHOR" in
            '' | *[!A-Za-z0-9_-]*)
              permission=none
              ;;
            *)
              permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq '.permission' 2>/dev/null || echo none)"
              ;;
          esac

          case "$permission" in
            admin | maintain | write)
              echo 'The author can push to this repository, so there is nothing to check.'
              exit 0
              ;;
          esac

          case "$NUMBER" in
            '' | *[!0-9]*)
              echo 'Missing or invalid issue or pull request number.' >&2
              exit 1
              ;;
          esac

          comment="$(cat <<'EOF'
          Thank you for your interest in `kizu-lang/bench`.

          This repository is maintained solely by the author, so external pull requests and issues are not accepted and this thread has been closed and locked automatically.

          Please share questions, bug reports, feedback, or ideas in [GitHub Discussions](https://github.com/kizu-lang/bench/discussions) — the author reviews posts there and decides what to address directly.

          ---

          `kizu-lang/bench` に関心をお寄せいただきありがとうございます。

          現在このリポジトリは作者のみで保守しているため、外部からの pull request および issue は受け付けておらず、このスレッドは自動的にクローズ・ロックされました。

          質問・不具合報告・フィードバック・アイデアなどは [GitHub Discussions](https://github.com/kizu-lang/bench/discussions) にお寄せください。作者が目を通し、直接対応する内容を判断しています。
          EOF
          )"

          case "$EVENT_NAME" in
            pull_request_target)
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$comment" --silent
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" -f state=closed --silent
              gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/$NUMBER/lock" --silent
              echo 'Closed and locked external pull request.'
              ;;
            issues)
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$comment" --silent
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$NUMBER" -f state=closed -f state_reason=not_planned --silent
              gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/$NUMBER/lock" --silent
              echo 'Closed and locked external issue.'
              ;;
            *)
              echo 'Unsupported event.' >&2
              exit 1
              ;;
          esac
