<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>kizu / bench</title>
  <meta name="description" content="Reproducible runtime, compile-speed, build-cache, and memory benchmarks comparing Kizu against Rust, C, Zig, and Go.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cockpit">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="brand-mark">kizu</span>
          <span class="brand-sep">/</span>
          <h1 class="brand-title">bench</h1>
        </div>
        <div class="switcher-group" aria-label="Environment switcher">
          <span class="switcher-label">Env</span>
          <div id="env-control" class="env-control"></div>
        </div>
        <div class="switcher-group" aria-label="Run selector">
          <label for="run-select" class="switcher-label">Run</label>
          <select id="run-select" class="run-select" aria-label="Benchmark run for selected environment"></select>
        </div>
        <button id="iso-badge" type="button" class="iso-badge"></button>
      </div>
      <nav class="topbar-right" aria-label="Links and methodology">
        <a href="https://github.com/kizu-lang/kizu" target="_blank" rel="noopener">kizu</a>
        <a href="https://github.com/kizu-lang/bench" target="_blank" rel="noopener">bench</a>
        <a href="https://github.com/kizu-lang/bench/discussions" target="_blank" rel="noopener">Discussions</a>
        <a href="https://github.com/kizu-lang/bench/tree/main/results" target="_blank" rel="noopener">Raw</a>
        <button id="btn-method" type="button" class="topbar-btn">Method</button>
      </nav>
    </header>

    <section id="kpi-strip" class="kpi-strip" aria-label="Key benchmark metrics"></section>

    <main class="grid" aria-label="Benchmark cockpit">
      <section id="q-runtime" class="quad" aria-labelledby="title-runtime">
        <div class="quad-head">
          <div class="quad-title-wrap">
            <h2 id="title-runtime" class="quad-title">Runtime</h2>
            <span id="sub-runtime" class="quad-sub"></span>
          </div>
          <div class="quad-controls">
            <div class="seg" role="group" aria-label="Runtime view" id="ctrl-rt-view"></div>
            <div class="seg" role="group" aria-label="Runtime variant scope" id="ctrl-rt-scope"></div>
            <button type="button" class="icon-btn" data-expand="runtime" aria-label="Expand runtime details" title="Full runtime breakdown">&#8599;</button>
          </div>
        </div>
        <div id="body-runtime" class="quad-body"></div>
      </section>

      <section id="q-compile" class="quad" aria-labelledby="title-compile">
        <div class="quad-head">
          <div class="quad-title-wrap">
            <h2 id="title-compile" class="quad-title">Compile</h2>
            <span id="sub-compile" class="quad-sub"></span>
          </div>
          <div class="quad-controls">
            <div class="seg" role="group" aria-label="Compile project size" id="ctrl-cp-size"></div>
            <div class="seg" role="group" aria-label="Compile phase" id="ctrl-cp-phase"></div>
            <button type="button" class="icon-btn" data-expand="compile" aria-label="Expand compile details" title="Full compile breakdown">&#8599;</button>
          </div>
        </div>
        <div id="body-compile" class="quad-body"></div>
      </section>

      <section id="q-cache" class="quad" aria-labelledby="title-cache">
        <div class="quad-head">
          <div class="quad-title-wrap">
            <h2 id="title-cache" class="quad-title">Cache &amp; RSS</h2>
            <span id="sub-cache" class="quad-sub"></span>
          </div>
          <div class="quad-controls">
            <div class="seg" role="group" aria-label="Cache size scale" id="ctrl-ca-size"></div>
            <div class="seg" role="group" aria-label="Cache or RSS metric" id="ctrl-ca-mode"></div>
            <button type="button" class="icon-btn" data-expand="cache" aria-label="Expand cache and memory details" title="Full cache and RSS breakdown">&#8599;</button>
          </div>
        </div>
        <div id="body-cache" class="quad-body"></div>
      </section>

      <section id="q-history" class="quad" aria-labelledby="title-history">
        <div class="quad-head">
          <div class="quad-title-wrap">
            <h2 id="title-history" class="quad-title">History</h2>
            <span id="sub-history" class="quad-sub"></span>
          </div>
          <div class="quad-controls">
            <div class="seg" role="group" aria-label="History metric" id="ctrl-hi-metric"></div>
            <button type="button" class="icon-btn" data-expand="history" aria-label="Expand history details" title="Full same-host history">&#8599;</button>
          </div>
        </div>
        <div id="body-history" class="quad-body"></div>
      </section>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div id="modal-dialog" class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div>
          <h2 id="modal-title" class="modal-title"></h2>
          <p id="modal-sub" class="modal-sub"></p>
        </div>
        <button id="modal-close" type="button" class="icon-btn modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
